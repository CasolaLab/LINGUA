name: stage 2 (2_homolog_exclusion)

on:
  push:
    paths: ['2_homolog_exclusion/**', '.github/workflows/stage2.yml']
  pull_request:
    paths: ['2_homolog_exclusion/**', '.github/workflows/stage2.yml']

defaults:
  run:
    working-directory: 2_homolog_exclusion


jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # BLAST+ and HMMER for test_run_stage2.py, from bioconda into their own prefix and not /usr/bin: the
      # "program missing" checks of the other tests run with PATH=/usr/bin:/bin and must not find them there.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tools
          create-args: -c conda-forge -c bioconda blast hmmer
          init-shell: bash
      - name: Shell scripts parse
        run: for f in scripts/*.sh setup/*.sh tests/*.sh; do bash -n "$f"; done
      - name: Run every test file
        shell: bash -el {0}
        run: |
          tools="$CONDA_PREFIX/bin"
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -vxF "$tools" | paste -sd: -):$tools"
          echo "python: $(command -v python3) $(python3 --version)"; blastp -version | head -1; jackhmmer -h | sed -n 2p
          status=0
          for t in tests/test_*.py; do
            echo "== $t"
            python3 "$t" | tail -1 | tee /tmp/last.txt
            grep -q "ALL PASSED" /tmp/last.txt || status=1
          done
          exit $status
