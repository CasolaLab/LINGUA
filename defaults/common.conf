# common.conf - defaults shared by every module.
# Format: key=value, '#' starts a comment, blank value = unset.
# Resolution order (last wins): defaults/common.conf, defaults/<module>.conf,
# --config file, command-line flags (--key value, or --set key=value).

# Species name is taken from the input FASTA file name (extension removed).
# Comma-separated suffixes removed from the end of that name. Stage 1 writes <species>_final.faa.
species_strip_suffixes=_final
