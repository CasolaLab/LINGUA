# domain-interpro.conf - defaults for the domain-interpro module (InterProScan).
# Where each default comes from, and how far it was checked: docs/thresholds.md.

# Analyses to run (-appl), comma-separated. This is the Casola lab's selection, not InterProScan's own default set:
#   - the lab's 12 member databases: Pfam, PRINTS, SMART, NCBIfam, SFLD, SUPERFAMILY, Gene3D, Hamap,
#     ProSiteProfiles, CDD, PIRSR, PIRSF;
#   - plus MobiDBLite, Coils, ProSitePatterns and AntiFam. The lab's rule is to IGNORE these four as false-positive
#     signals (see exclude_analyses and spurious_analyses below). They are run so that they are visible in the
#     results and reported (EXCLUDED_ONLY, SPURIOUS) instead of silently absent. Ignoring them gives the same
#     pass/fail answer as not running them.
# Names must match your InterProScan version; `check` confirms them against your installation.
applications=Pfam,PRINTS,SMART,NCBIfam,SFLD,SUPERFAMILY,Gene3D,Hamap,ProSiteProfiles,CDD,PIRSR,PIRSF,MobiDBLite,Coils,ProSitePatterns,AntiFam

# Domains that do NOT count against a candidate even though they are domains: known lineage-specific
# domains for the user's clade (Pfam/InterPro accession or name, comma-separated). Empty by default.
ignore_domains=

# Analyses that do NOT count as domain evidence: low-complexity / short-pattern signals.
# Comma-separated. Matching ignores case and punctuation (MobiDB-Lite == MobiDBLite).
#   MobiDB-Lite, Coils: predict disorder / coiled coils, not domains.
#   ProSitePatterns: short regular expressions that match by chance.
# Genes whose only hits are from these analyses get status EXCLUDED_ONLY and pass.
exclude_analyses=MobiDBLite,Coils,ProSitePatterns

# Analyses that flag a spurious gene model (not a domain). Genes with such a hit and no
# counted hit get status SPURIOUS.
spurious_analyses=AntiFam

# What to do with SPURIOUS genes: flag = report only, gene still passes;
# remove = gene does not pass. flag is the default: AntiFam flags a spurious gene model, which is not evidence against the gene.
antifam_action=flag

# Optional cut-off on the per-hit E-value column of the InterProScan TSV. Blank = trust each
# member database's own curated thresholds (InterProScan default behavior).
max_evalue=

# The module always runs InterProScan with -dp (no pre-calculated lookup): every result is computed on your
# machine, nothing is sent to EBI, and no internet connection is needed. This is fixed and cannot be changed.
# Sequences per InterProScan job, and number of jobs run at once.
chunk_size=1000
parallel_jobs=4
