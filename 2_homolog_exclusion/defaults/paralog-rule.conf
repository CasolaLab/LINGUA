# paralog-rule.conf - defaults for the paralog-rule module (a paralog among the established genes of the same genome).
# Where each default comes from: docs/paralog-rule.md.

# A passing gene is removed when one BLASTp alignment to a gene of its own proteome that is NOT a candidate has at least
# min_pident % identity and covers at least min_qcov % of the passing gene's length, at E <= evalue.
# 50 and 50 are the Casola Lab's choice for the Brassicaceae screen (2026-11).
min_pident=50
min_qcov=50
evalue=1e-5

# SEG off, as in the study: short low-complexity proteins (cysteine-rich metallothioneins, for example) are searched over
# their full length.
seg=no
max_target_seqs=50
