# homology-blast.conf - defaults for the homology-blast module (BLAST+ blastp or tblastn).
# Where each default comes from, and how far it was checked: docs/thresholds.md.
#
# Rule: ANY hit counts against a candidate. The user must build the database without the analysis
# species or any close relative that could fit the tree. Hits from analysis species or ignore_taxa
# species are reported but not counted (status IN_PHYLOGENY_ONLY) unless ignore_in_phylogeny=no.

# blastp = protein query vs protein database.
# tblastn = protein query vs nucleotide database (e.g. organelle genomes).
program=blastp

# E-value threshold. BLAST's own default (10) is a search default; 1e-3 is a common filtering cutoff.
evalue=1e-3

# Minimum percent of the QUERY covered by all alignments to one target (union of the alignments).
# The query is the candidate gene; the question is whether a meaningful part of it is homologous.
# 0 = no requirement.
min_qcov=50

# Minimum percent of the TARGET covered. Off by default: it would discard a short candidate that
# matches one domain of a long protein. 0 = no requirement.
min_tcov=0

# Minimum percent identity. Blank = report only, no requirement (identity depends on divergence).
min_pident=

# Mask low-complexity regions in the query (-seg): yes or no. Low-complexity segments produce spurious hits.
# The BLAST web default filters them; the blastp command-line default does not.
seg=yes

# Passed through to BLAST+ when set (blank = BLAST's own default):
#   max_hsps          -max_hsps
#   ungapped          yes = -ungapped
#   comp_based_stats  -comp_based_stats (0 = off, 1, 2, 3)
max_hsps=
ungapped=no
comp_based_stats=

# Effective database size for E-value calculation (-dbsize). Blank = actual size. Set it to make
# E-values comparable across databases of different sizes.
dbsize=

# Large value so BLAST does not truncate hits: -max_target_seqs keeps the FIRST N found, not the best N.
max_target_seqs=5000

# yes = hits from analysis species (and ignore_taxa) are reported but not counted.
# Use no for organelle databases: a hit to the analysis species' own organelle genome IS the signal.
ignore_in_phylogeny=yes

# Where a hit's species comes from: header = the '__<Species_Name>' suffix of the database sequence ID
# (Stage 0 --add-species); map = taxon_map file (accession <tab> species).
species_source=header
taxon_map=

# How a hit's species is compared with the analysis species and ignore_taxa:
#   species = the first two words (Genus species); subspecies, varieties and strains count as the same species,
#             so 'Marchantia polymorpha subsp. ruderalis' matches 'Marchantia_polymorpha' (default)
#   exact   = the whole name, subspecies or strain included
#   genus   = the first word only (also exempts hits to congeners, so use with care)
# The analysis species' full names come from --species-map; without it the input file name is used as is.
match_level=species

# Extra species/genus names whose hits are not counted (comma-separated; spaces or underscores both work).
# A single word is read as a genus.
ignore_taxa=

chunk_size=1000
parallel_jobs=4
