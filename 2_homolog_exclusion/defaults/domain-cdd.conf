# domain-cdd.conf - defaults for the domain-cdd module (RPS-BLAST against NCBI CDD).
# Where each default comes from, and how far it was checked: docs/thresholds.md.

# E-value threshold. 1e-2 is the NCBI CD-Search default.
evalue=1e-2

# Minimum percent of the CDD model (domain) covered by the alignment. A partial match to a
# domain model is weaker evidence than a full one. Percent, 0-100. 0 = no requirement.
min_domain_cov=50

# Minimum percent of the query covered by the alignment. 0 = no requirement.
min_qcov=0

# CDD source databases whose hits do not count (comma-separated, e.g. COG,KOG). Empty by default: every CDD hit
# counts. Each hit's CDD accession and source are always written to hits.tsv so they can be inspected.
ignore_sources=

# Composition-based statistics passed to rpsblast (-comp_based_stats). 0 = off, 1 = on (BLAST default).
comp_based_stats=1

# rpsblast threads per job and number of chunks run at once.
chunk_size=1000
parallel_jobs=4
