# homology-jackhmmer.conf - defaults for the homology-jackhmmer module.
# Where each default comes from, and how far it was checked: docs/thresholds.md.
#
# Same hit rule as homology-blast: ANY hit counts; analysis species and ignore_taxa species are
# reported but not counted (IN_PHYLOGENY_ONLY). The user builds a database without close relatives.

# Reporting E-value (-E). HMMER's own default is 10; 1e-3 is a common filtering cutoff.
evalue=1e-3

# Inclusion E-value (--incE) for building the profile between iterations. HMMER default is 0.001.
incE=1e-3

# Number of iterations (-N). 3 is a common depth for remote-homology search; more iterations
# increase sensitivity but risk profile drift (false positives).
iterations=3

# Database size for E-value calculation (-Z), in sequences. Blank = actual size. Set it to make E-values
# comparable across databases of different sizes.
dbsize=

# Coverage, as in homology-blast: percent of the QUERY covered by the union of the hit's domains whose own E-value passes
# (default 50); optional percent of the target (default 0 = off).
min_qcov=50
min_tcov=0

# yes = hits from analysis species (and ignore_taxa) are reported but not counted.
ignore_in_phylogeny=yes

species_source=header
taxon_map=

# species = the first two words (Genus species): subspecies, varieties and strains count as the same species (default);
# exact = the whole name; genus = the first word only (also exempts congeners, so use with care).
# Full names of the analysis species come from --species-map.
match_level=species

# Extra species/genus names whose hits are not counted (a single word is read as a genus).
ignore_taxa=

# Queries per jackhmmer job. 1 on purpose: what one query costs depends on how many hits it finds and how big its profile grows,
# not on its length, so there is no way to balance chunks in advance; a chunk of several queries can leave most CPUs idle
# while one chunk finishes (measured: 200 proteins, chunks of 10 took 37 min for 152 CPU-min of work on 8 CPUs).
# Reading the database again for each query costs about a second. Raise it only for a huge query set of small proteins.
chunk_size=1

# Number of jobs run at once. Each uses --threads CPUs (default 1).
parallel_jobs=4

# --- added in 0.2.0 (stage-2 re-screen of the Casola Lab, 2026-11) ---
# E-value (full sequence) a hit must reach to COUNT, when stricter than the search E-value (blank = same as evalue).
filter_evalue=
# Minimum number of distinct genera among a gene's counted hits (all species of a genus count once). 1 = any hit counts.
min_genera=1
# A hit does not count when its full-sequence composition bias is >= this fraction of its bit score (blank = off).
# 0.5 = the lab's rule: bias must be below half the score, which drops hits driven by low-complexity or repetitive sequence.
max_bias_frac=
