# hog-rule.conf - defaults for the hog-rule module (homology through a hierarchical orthogroup).
# Where each default comes from: docs/hog-rule.md.

# Runs (their --label) whose counted hits are homology evidence that can spread through a HOG, comma-separated.
# Blank = every run read by combine. Leave out screens that are not homology to an outside species (TE, organelle).
evidence_runs=

# A gene that passed every search is removed when its BLASTp alignment to a removed member of its HOG overlaps that member's
# evidence region (the union of the query intervals of the member's counted hits) by at least this many amino acids.
# 20 is the Casola Lab's choice for the Brassicaceae screen (2026-11); 1 = any overlap.
min_overlap_aa=20

# Within-HOG BLASTp. dbsize fixes the E-value scale so that it does not depend on how many members are searched.
evalue=1e-3
dbsize=100000000
seg=yes
max_target_seqs=5000

# A gene that aligns to a removed member whose evidence region is unknown (no coordinates in its hits.tsv) and overlaps no
# known region enough: fail = verdict REGION_UNKNOWN, does not pass (default; a pass needs evidence of absence);
# pass = treated as not overlapping.
unknown_region=fail
