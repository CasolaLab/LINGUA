# brassicaceae_2026.conf - the stage-2 rules of the Casola Lab's Brassicaceae de novo gene study (re-screen of 2026-11).
# Use with --config presets/brassicaceae_2026.conf for homology-blast, homology-jackhmmer, domain-cdd, domain-interpro and
# hog-rule. The TE screen is a second homology-blast run with presets/brassicaceae_2026_te.conf; the organelle screen uses
# presets/organelle_tblastn.conf. STAGE2_PROTOCOL.md gives every command and why each value was chosen.

[homology-blast]
# search at 1e-3, count hits at 1e-5 from >= 2 genera; no coverage requirement; ten targets per database, as in the lab's runs
evalue=1e-3
filter_evalue=1e-5
min_genera=2
min_qcov=0
max_target_seqs=10
seg=yes

[homology-jackhmmer]
# one iteration; -E 1e-4, --incE 1e-5; count full-sequence hits at 1e-5 with bias < 0.5 x score from >= 2 genera
iterations=1
evalue=1e-4
incE=1e-5
filter_evalue=1e-5
max_bias_frac=0.5
min_genera=2
min_qcov=0

[domain-cdd]
# CD-Search default E-value, no model-coverage requirement; four Brassicaceae-restricted DUFs do not count
evalue=1e-2
min_domain_cov=0
ignore_domains=pfam02713,pfam05212,pfam06683,pfam06880

[domain-interpro]
# kept analyses plus PANTHER (AntiFam stays a flag, as by default); E <= 1e-3 where an E-value is reported (PANTHER exempt); three motif signatures and the four
# DUFs do not count; PANTHER families count only with a species outside A. thaliana, B. napus, B. rapa and T. cacao
applications=Pfam,PRINTS,SMART,NCBIfam,SFLD,SUPERFAMILY,Gene3D,Hamap,ProSiteProfiles,CDD,PIRSR,PIRSF,PANTHER,MobiDBLite,Coils,ProSitePatterns,AntiFam
exclude_analyses=MobiDBLite,Coils,ProSitePatterns
max_evalue=1e-3
require_evalue=yes
max_evalue_exempt=PANTHER
ignore_domains=PS51257,PR01217,PR01228,PF02713,PF05212,PF06683,PF06880
panther_family_species=panther_family_species.tsv
panther_exclude_species=ARATH,BRANA,BRACM,THECC

[hog-rule]
evidence_runs=blast,jackhmmer,cdd,interpro
min_overlap_aa=20
evalue=1e-3
dbsize=100000000
seg=yes
