# brassicaceae_2026_te.conf - the lab's transposable-element screen: BLASTp of candidates against a TE protein library, removing
# a candidate when ONE alignment covers at least 50% of it. Use with homology-blast --label te. Hits to any species count.

[homology-blast]
evalue=1e-3
seg=yes
comp_based_stats=0
word_size=2
matrix=PAM30
max_hsps=5
max_target_seqs=10
min_qcov=50
qcov_mode=single_hsp
ignore_in_phylogeny=no
