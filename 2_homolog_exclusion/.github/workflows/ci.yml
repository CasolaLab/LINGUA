name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Shell scripts parse
        run: for f in scripts/*.sh setup/*.sh tests/*.sh; do bash -n "$f"; done
      - name: Run every test file
        run: |
          status=0
          for t in tests/test_*.py; do
            echo "== $t"
            python3 "$t" | tail -1 | tee /tmp/last.txt
            grep -q "ALL PASSED" /tmp/last.txt || status=1
          done
          exit $status
