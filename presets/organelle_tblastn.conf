# organelle_tblastn.conf - example settings for a leaked-organellar-gene screen (works for any dataset).
# Use with:  --config presets/organelle_tblastn.conf  --label organelle  and a NUCLEOTIDE database of
# organelle genomes (mitochondrial and/or chloroplast) that you build yourself.
#
# Organellar genes are highly conserved and uniparentally inherited, so any hit to an organelle genome,
# including the analysis species' own, marks the candidate as a leaked organellar sequence.
# This is an example, not a recommendation for every project: adjust it to your data.

[homology-blast]
program=tblastn
evalue=1e-3
seg=yes
max_hsps=5
ungapped=yes
comp_based_stats=0
min_qcov=0
min_tcov=0
ignore_in_phylogeny=no
