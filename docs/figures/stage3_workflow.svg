   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="88.272" y="24.941836" transform="rotate(-0 88.272 24.941836)">Input</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(42.619969 43.591777)">HAL alignment</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(20.979031 59.70627)">(Progressive Cactus);</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(12.016844 77.123418)">reference BED and CDS</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(24.990906 91.84666)">FASTA; species tree</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="276.336" y="24.941836" transform="rotate(-0 276.336 24.941836)">1  Extract blocks</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(211.757719 45.06834)">mafExtractor at each</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(206.293344 59.788301)">exon; stops on a failed</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(216.816313 75.650137)">or empty extraction</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="464.4" y="24.941836" transform="rotate(-0 464.4 24.941836)">2–3  Dominant chain</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(393.976719 43.673809)">each species keeps its</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(401.369375 61.012207)">collinear block chain</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(387.555313 75.670918)">per exon; jumps &gt; 50 kb,</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(394.378125 93.070566)">chromosome or strand</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(426.6525 107.790527)">are dropped</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="652.464" y="24.941836" transform="rotate(-0 652.464 24.941836)">4–7  Exon FASTA</text>
   </g>
   <g id="text_8">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(589.037438 43.591777)">blocks joined into an</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(582.949625 59.70627)">aligned FASTA, strand</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(579.701188 77.041387)">corrected and validated</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="840.528" y="24.941836" transform="rotate(-0 840.528 24.941836)">8–8c  Stitch exons</text>
   </g>
   <g id="text_10">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(764.265188 43.673809)">one row per species and</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(788.793625 61.09752)">ancestor from its</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(778.660031 77.041387)">collinear exon chain</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(769.387219 91.764629)">(≤ 50 kb); missing-data</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(801.243781 109.099746)">mask written</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="88.272" y="191.981836" transform="rotate(-0 88.272 191.981836)">9–11  Trim and check</text>
   </g>
   <g id="text_12">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(26.405125 210.713809)">extra base per exon</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(15.906219 227.228613)">removed; the reference</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(25.634031 242.85748)">must equal the CDS</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="276.336" y="191.981836" transform="rotate(-0 276.336 191.981836)">12–14b  Mutations</text>
   </g>
   <g id="text_14">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(207.465844 210.713809)">start and stop codons;</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(215.643813 228.13752)">frameshift deletions</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(202.027719 242.775449)">(masked gaps skipped);</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(209.793344 258.801348)">evidence per deletion</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="464.4" y="191.981836" transform="rotate(-0 464.4 191.981836)">15–16  Motifs</text>
   </g>
   <g id="text_16">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(408.766406 212.10834)">first and last three</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(399.4225 226.742988)">bases; start and stop</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(417.716563 244.166699)">motifs checked</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="652.464" y="191.981836" transform="rotate(-0 652.464 191.981836)">17  Combine</text>
   </g>
   <g id="text_18">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(591.379156 210.799121)">per-species span of</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(583.979938 226.742988)">the kept exons, extant</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(615.894469 244.081387)">or ancestral</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="840.528" y="191.981836" transform="rotate(-0 840.528 191.981836)">Output</text>
   </g>
   <g id="text_20">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(777.887844 210.631777)">alignment per locus;</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(774.374719 226.742988)">indel and stop tables;</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(804.341281 244.081387)">coordinates</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(785.663313 258.719316)">→ stages 4 and 5</text>
   </g>
  </g>
 </g>
