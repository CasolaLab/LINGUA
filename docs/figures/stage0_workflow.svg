   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="88.272" y="24.941836" transform="rotate(-0 88.272 24.941836)">Input</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(9.817313 43.759121)">GFF3 and protein FASTA</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(26.017938 59.702988)">per species, chosen</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(18.250125 75.735449)">upstream (for example</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(51.710125 91.769004)">by BUSCO)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="276.336" y="24.941836" transform="rotate(-0 276.336 24.941836)">Protein QC</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(208.257719 43.673809)">removes proteins with</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(214.861781 60.103301)">no start methionine,</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(209.411625 76.153262)">shorter than 30 aa, or</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(214.081938 91.761348)">with an internal stop</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="464.4" y="24.941836" transform="rotate(-0 464.4 24.941836)">Isoform selection</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(399.799844 43.591777)">one protein per gene</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(398.656875 59.70627)">(the longest isoform);</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(394.360625 75.650137)">gene IDs standardized</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="652.464" y="24.941836" transform="rotate(-0 652.464 24.941836)">CDS and cDNA</text>
   </g>
   <g id="text_8">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(579.321656 43.67709)">longest CDS and cDNA</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(589.43775 59.788301)">of each kept isoform</text>
   </g>
   <g id="text_9">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; text-anchor: middle; fill: #5b5b5b" x="652.464" y="78.952383" transform="rotate(-0 652.464 78.952383)">optional</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="840.528" y="24.941836" transform="rotate(-0 840.528 24.941836)">Output</text>
   </g>
   <g id="text_11">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(784.881281 44.074121)">one standardized,</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(763.480969 59.702988)">non-redundant proteome</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(804.733938 75.732168)">per species</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(808.623313 91.700098)">→ stage 1</text>
   </g>
  </g>
