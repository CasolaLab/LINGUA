   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="111.78" y="24.941836" transform="rotate(-0 111.78 24.941836)">Input</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(37.065938 43.612559)">stage 3 coordinates and</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(51.08125 59.620957)">alignments; stage 4</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(32.029219 76.217793)">summaries and tBLASTn;</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(47.977188 91.851035)">HOG table; proteins;</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(44.085625 107.793809)">branch lengths; GFF3</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="346.86" y="24.941836" transform="rotate(-0 346.86 24.941836)">1–1a  Coordinates</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(286.943281 43.591777)">each locus in every</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(269.061563 59.710645)">genome carrying its ORF</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(283.053906 75.735449)">(tBLASTn, or 1a: the</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(291.232969 91.769004)">stage 4 ORF rule)</text>
   </g>
   <g id="text_5">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(259.697969 115.281699)">1a: genomes with no usable</text>
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(274.486563 130.477988)">alignment are unknown</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="581.94" y="24.941836" transform="rotate(-0 581.94 24.941836)">2  Ancestral loci</text>
   </g>
   <g id="text_7">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(499.833281 43.591777)">genes at the same aligned</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(505.672813 59.620957)">position joined within the</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(508.017813 76.222168)">ORF-node clade; oldest</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(511.529844 91.769004)">ORF node; DNG if any</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(549.269688 109.099746)">member is</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="817.02" y="24.941836" transform="rotate(-0 817.02 24.941836)">3  Gene overlap</text>
   </g>
   <g id="text_9">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(738.83 45.065059)">removes loci whose CDS</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(748.544688 59.788301)">overlaps the CDS of a</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(724.807031 75.650137)">same-strand gene; antisense,</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(748.539219 91.679316)">intronic and intergenic</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(791.342031 107.790527)">loci kept</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="111.78" y="209.621836" transform="rotate(-0 111.78 209.621836)">4  Unclustered duplicates</text>
   </g>
   <g id="text_11">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(46.409844 228.271777)">loci in no orthogroup:</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(38.248281 244.468301)">BLASTp within species,</text>
    <!-- E ≤ 10$^{-5}$; the longest -->
    <g style="fill: #1a1a1a" transform="translate(47.59 261.272949)">
     <text>
      <tspan x="0" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a">E</tspan>
      <tspan x="9.337891" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a"> </tspan>
      <tspan x="13.227539" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a">≤</tspan>
      <tspan x="20.911133" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a"> </tspan>
      <tspan x="24.800781" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a">1</tspan>
      <tspan x="32.586914" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a">0</tspan>
      <tspan x="52.036816" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a">;</tspan>
      <tspan x="55.926465" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a"> </tspan>
      <tspan x="59.816113" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a">t</tspan>
      <tspan x="63.705762" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a">h</tspan>
      <tspan x="71.491895" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a">e</tspan>
      <tspan x="79.278027" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a"> </tspan>
      <tspan x="83.167676" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a">l</tspan>
      <tspan x="86.278027" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a">o</tspan>
      <tspan x="94.06416" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a">n</tspan>
      <tspan x="101.850293" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a">g</tspan>
      <tspan x="109.636426" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a">e</tspan>
      <tspan x="117.422559" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a">s</tspan>
      <tspan x="124.422559" y="-0.990625" style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a">t</tspan>
      <tspan x="40.500195" y="-6.076563" style="font-size: 9.8px; font-family: 'Arial'; fill: #1a1a1a">−</tspan>
      <tspan x="46.223242" y="-6.076563" style="font-size: 9.8px; font-family: 'Arial'; fill: #1a1a1a">5</tspan>
     </text>
    </g>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(41.361094 276.444629)">protein of a family kept</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="346.86" y="209.621689" transform="rotate(-0 346.86 209.621689)">5  Origins</text>
   </g>
   <g id="text_13">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(258.162344 228.361465)">loci sharing a HOG form one</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(262.826094 244.38627)">DNG and one PDNG origin</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(259.317344 260.415449)">per lineage; PDNG paralogs</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(290.053906 276.52666)">of a DNG dropped</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="581.94" y="209.621836" transform="rotate(-0 581.94 209.621836)">5  Births and deaths</text>
   </g>
   <g id="text_15">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(504.116406 229.74834)">birth on the branch of the</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(510.734688 244.300957)">oldest locus; deaths by</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(522.026563 260.330137)">Dollo parsimony on</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(511.507969 276.441348)">presence; an unknown</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(494.7725 292.388496)">genome never adds a death</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="817.02" y="209.621836" transform="rotate(-0 817.02 209.621836)">Output</text>
   </g>
   <g id="text_17">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(761.376563 228.754121)">births, deaths and</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(752.825625 244.38627)">rates (count / branch</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(758.267031 260.415449)">length) per branch;</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(760.987188 276.444629)">fate of every gene</text>
   </g>
  </g>
 </g>
