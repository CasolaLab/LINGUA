   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(48.743906 43.612559)">stage 3 coordinates;</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(39.027031 59.620957)">stage 4 summaries and</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(44.865469 76.222168)">tBLASTn; HOG table;</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(61.587813 91.761348)">proteins; branch</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(29.692969 107.793809)">lengths; GFF3 per species</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="346.86" y="24.941836" transform="rotate(-0 346.86 24.941836)">1  Coordinates</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(286.943281 43.591777)">each locus in every</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(270.599375 59.70627)">genome where tBLASTn</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(306.409844 77.127793)">finds its ORF</text>
   </g>
   <g id="text_5">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; text-anchor: middle; fill: #5b5b5b" x="346.86" y="96.592383" transform="rotate(-0 346.86 96.592383)">stops if gene IDs differ</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="581.94" y="24.941836" transform="rotate(-0 581.94 24.941836)">2  Ancestral loci</text>
   </g>
   <g id="text_7">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(499.833281 43.591777)">genes at the same aligned</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(505.672813 59.620957)">position joined within the</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(508.017813 76.222168)">ORF-node clade; oldest</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(511.529844 91.769004)">ORF node; DNG if any</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(549.269688 109.099746)">member is</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="817.02" y="24.941836" transform="rotate(-0 817.02 24.941836)">3  Gene overlap</text>
   </g>
   <g id="text_9">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(738.83 45.065059)">removes loci whose CDS</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(748.544688 59.788301)">overlaps the CDS of a</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(724.807031 75.650137)">same-strand gene; antisense,</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(748.539219 91.679316)">intronic and intergenic</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(791.342031 107.790527)">loci kept</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="111.78" y="191.981836" transform="rotate(-0 111.78 191.981836)">4  Unclustered duplicates</text>
   </g>
