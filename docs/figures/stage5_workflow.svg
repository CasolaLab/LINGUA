   <g id="text_12">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="346.86" y="191.981689" transform="rotate(-0 346.86 191.981689)">5  Origins</text>
   </g>
   <g id="text_13">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(258.162344 210.721465)">loci sharing a HOG form one</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(262.826094 226.74627)">DNG and one PDNG origin</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(259.317344 242.775449)">per lineage; PDNG paralogs</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(290.053906 258.88666)">of a DNG dropped</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="581.94" y="191.981836" transform="rotate(-0 581.94 191.981836)">5  Births and deaths</text>
   </g>
   <g id="text_15">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(504.116406 212.10834)">birth on the branch of the</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(510.734688 226.660957)">oldest locus; deaths by</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(522.026563 242.690137)">Dollo parsimony on</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(523.188125 258.88666)">tBLASTn presence</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="817.02" y="191.981836" transform="rotate(-0 817.02 191.981836)">Output</text>
   </g>
   <g id="text_17">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(761.376563 211.114121)">births, deaths and</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(752.825625 226.74627)">rates (count / branch</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(758.267031 242.775449)">length) per branch;</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(760.987188 258.804629)">fate of every gene</text>
