   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="111.78" y="24.941836" transform="rotate(-0 111.78 24.941836)">Input</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(64.314531 43.612559)">stage 3 results;</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(54.577969 59.702988)">candidate proteins</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(82.21375 75.735449)">(stage 2);</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(62.363281 91.764629)">tree_config.json</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="346.86" y="24.941836" transform="rotate(-0 346.86 24.941836)">1–3  Prepare</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(276.045156 43.591777)">unpack; gaps removed</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(274.499688 59.70627)">from every species and</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(286.157969 75.732168)">ancestral sequence</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="581.94" y="24.941836" transform="rotate(-0 581.94 24.941836)">4  ORF presence</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(496.731406 43.759121)">tBLASTn of each protein vs</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(494.787813 59.620957)">every species and ancestor;</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(509.975625 75.821855)">intact ORF: Met to stop</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(487.618281 91.764629)">≥ 80% of query, ≥ 40% identity</text>
   </g>
   <g id="text_7">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; text-anchor: middle; fill: #5b5b5b" x="581.94" y="114.232383" transform="rotate(-0 581.94 114.232383)">→ oldest ORF node</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="817.02" y="24.941689" transform="rotate(-0 817.02 24.941689)">5  Synteny</text>
   </g>
   <g id="text_9">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(761.036406 44.965527)">≥ 40% of the focal</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(777.721563 59.70627)">CDS aligned</text>
   </g>
   <g id="text_10">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; text-anchor: middle; fill: #5b5b5b" x="817.02" y="78.952383" transform="rotate(-0 817.02 78.952383)">→ oldest syntenic node</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="88.272" y="191.981836" transform="rotate(-0 88.272 191.981836)">6–6b  Disablers</text>
   </g>
   <g id="text_12">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(22.51575 210.713809)">indels and premature</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(27.234188 226.681738)">stops shared by ≥ 2</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(12.398563 244.167793)">nodes between the ORF</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(29.511375 258.719316)">and synteny nodes</text>
   </g>
   <g id="text_13">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(15.519031 282.321699)">events on ORF-bearing</text>
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(41.569969 297.517988)">nodes dropped</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="276.336" y="191.981689" transform="rotate(-0 276.336 191.981689)">7  Classify</text>
   </g>
   <g id="text_15">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(212.13725 212.105059)">DNG: enabler on the</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(204.748969 228.138613)">branch before the ORF</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(208.242406 243.257793)">node, absent from the</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(203.983344 259.291348)">ORF clade; else PDNG</text>
   </g>
   <g id="text_16">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(217.724125 282.321699)">ORF window set in</text>
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(226.919281 297.517988)">tree_config.json</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="464.4" y="191.981836" transform="rotate(-0 464.4 191.981836)">7c–7e  Corroborate</text>
   </g>
   <g id="text_18">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(387.345313 212.023027)">both enabler nodes seen</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(400.587344 226.742988)">in an extant species,</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(392.021094 242.690137)">and they are the parent</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(393.573125 258.804629)">and grandparent of the</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(393.21 275.320527)">ORF node; else PDNG</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="652.464" y="191.981836" transform="rotate(-0 652.464 191.981836)">8–9  Summarize</text>
   </g>
   <g id="text_20">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(591.366031 210.631777)">counts by node and</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(582.037438 226.742988)">species; loci placed on</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(599.154625 242.690137)">internal nodes by</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(616.277281 260.110566)">coordinates</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="840.528" y="191.981836" transform="rotate(-0 840.528 191.981836)">Output</text>
   </g>
   <g id="text_22">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(759.220813 210.71709)">DNG and PDNG catalogs;</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(788.787063 228.052207)">node summaries</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(804.733938 242.772168)">per species</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(808.623313 258.651504)">→ stage 5</text>
   </g>
