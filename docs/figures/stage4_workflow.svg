   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="88.272" y="24.941836" transform="rotate(-0 88.272 24.941836)">Input</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(40.806531 43.612559)">stage 3 results;</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(31.069969 59.702988)">candidate proteins</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(58.70575 75.735449)">(stage 2);</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(38.855281 91.764629)">tree_config.json</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="276.336" y="24.941836" transform="rotate(-0 276.336 24.941836)">1–3  Prepare</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(205.521156 43.591777)">unpack; gaps removed</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(203.975687 59.70627)">from every species and</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(215.633969 75.732168)">ancestral sequence</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="464.4" y="24.941836" transform="rotate(-0 464.4 24.941836)">4–4b  ORF presence</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(400.204531 43.681465)">longest ORF of each</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(398.253281 59.702988)">species and ancestor</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(389.747187 76.217793)">≥ 80% of the focal CDS,</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(410.361094 93.053066)">≥ 80% of it in one</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(415.377031 109.185059)">unbroken frame</text>
   </g>
   <g id="text_7">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(399.805313 132.921699)">→ oldest node of the</text>
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(415.370469 148.117988)">unbroken run of</text>
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(391.653594 163.314277)">ORF-bearing ancestors</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="652.464" y="24.941689" transform="rotate(-0 652.464 24.941689)">5  Synteny</text>
   </g>
   <g id="text_9">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(596.480406 44.965527)">≥ 40% of the focal</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(613.165563 59.70627)">CDS aligned</text>
   </g>
   <g id="text_10">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; text-anchor: middle; fill: #5b5b5b" x="652.464" y="78.952383" transform="rotate(-0 652.464 78.952383)">→ oldest syntenic node</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="840.528" y="24.941836" transform="rotate(-0 840.528 24.941836)">5a–5c  Event tables</text>
   </g>
   <g id="text_12">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(772.047219 43.759121)">stops read in the focal</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(765.054875 59.70627)">frame; start-codon gains</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(758.800813 75.650137)">added; indels at unaligned</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(775.949719 91.679316)">ends or over missing</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(797.728469 109.099746)">data removed</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="88.272" y="244.901836" transform="rotate(-0 88.272 244.901836)">6–6c  Disablers</text>
   </g>
   <g id="text_14">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(15.519031 263.633809)">indels, premature stops</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(11.227156 279.580957)">and start-codon changes</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(18.625281 295.610137)">shared by consecutive</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(57.925906 312.91791)">ancestors</text>
   </g>
   <g id="text_15">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(15.519031 335.241699)">events on ORF-bearing</text>
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(22.892 350.437988)">nodes, end gaps, the</text>
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(44.689344 365.634277)">focal stop and</text>
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(11.242469 380.830566)">homopolymer indels with</text>
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(10.065594 396.068145)">no extant carrier dropped</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="276.336" y="244.901689" transform="rotate(-0 276.336 244.901689)">7–7c  Classify</text>
   </g>
   <g id="text_17">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(212.13725 265.025059)">DNG: enabler on the</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(204.748969 281.058613)">branch before the ORF</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(208.242406 296.177793)">node, absent from the</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(203.983344 312.211348)">ORF clade; else PDNG</text>
   </g>
   <g id="text_18">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(206.037406 335.241699)">ORF found outside the</text>
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(214.865063 350.437988)">ingroup → removed</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="464.4" y="244.901689" transform="rotate(-0 464.4 244.901689)">7d–7g  Corroborate</text>
   </g>
   <g id="text_20">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(387.345313 264.943027)">both enabler nodes seen</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(400.587344 279.662988)">in an extant species,</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(392.021094 295.610137)">and they are the parent</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(393.573125 311.724629)">and grandparent of the</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(393.21 328.240527)">ORF node; else PDNG</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="652.464" y="244.901836" transform="rotate(-0 652.464 244.901836)">7h–7i  Recheck</text>
   </g>
   <g id="text_22">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(573.111344 265.025059)">DNG → PDNG if an older</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(574.655719 280.152988)">ancestor has the ORF, or</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(583.989781 295.695449)">if parsimony on extant</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(581.255406 311.721348)">species does not place</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(587.4865 329.059746)">the ancestral state at</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(608.498531 345.175332)">the ORF node</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="840.528" y="244.901836" transform="rotate(-0 840.528 244.901836)">8–9  Output</text>
   </g>
