   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="111.78" y="24.941836" transform="rotate(-0 111.78 24.941836)">Input</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(64.314531 43.612559)">stage 3 results;</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(54.577969 59.702988)">candidate proteins</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(82.21375 75.735449)">(stage 2);</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(62.363281 91.764629)">tree_config.json</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="346.86" y="24.941836" transform="rotate(-0 346.86 24.941836)">1–3  Prepare</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(276.045156 43.591777)">unpack; gaps removed</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(274.499688 59.70627)">from every species and</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(286.157969 75.732168)">ancestral sequence</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="581.94" y="24.941836" transform="rotate(-0 581.94 24.941836)">4–4b  ORF presence</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(517.744531 43.681465)">longest ORF of each</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(515.793281 59.702988)">species and ancestor</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(507.287188 76.217793)">≥ 80% of the focal CDS,</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(521.6875 93.053066)">≥ 50% of it in frame</text>
   </g>
   <g id="text_7">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(486.213906 115.281699)">→ oldest node of the unbroken</text>
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(489.350781 130.477988)">run of ORF-bearing ancestors</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="817.02" y="24.941689" transform="rotate(-0 817.02 24.941689)">5  Synteny</text>
   </g>
   <g id="text_9">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(761.036406 44.965527)">≥ 40% of the focal</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(777.721563 59.70627)">CDS aligned</text>
   </g>
   <g id="text_10">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; text-anchor: middle; fill: #5b5b5b" x="817.02" y="78.952383" transform="rotate(-0 817.02 78.952383)">→ oldest syntenic node</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="88.272" y="209.621836" transform="rotate(-0 88.272 209.621836)">5b–6c  Disablers</text>
   </g>
   <g id="text_12">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(15.519031 228.353809)">indels, premature stops</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(11.227156 244.300957)">and start-codon changes</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(18.625281 260.330137)">shared by consecutive</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(57.925906 277.63791)">ancestors</text>
   </g>
   <g id="text_13">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(15.519031 299.961699)">events on ORF-bearing</text>
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(22.888719 315.157988)">nodes, end gaps and</text>
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(11.242469 330.354277)">homopolymer indels with</text>
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(10.065594 345.591855)">no extant carrier dropped</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="276.336" y="209.621689" transform="rotate(-0 276.336 209.621689)">7–7c  Classify</text>
   </g>
   <g id="text_15">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(212.13725 229.745059)">DNG: enabler on the</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(204.748969 245.778613)">branch before the ORF</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(208.242406 260.897793)">node, absent from the</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(203.983344 276.931348)">ORF clade; else PDNG</text>
   </g>
   <g id="text_16">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(206.037406 299.961699)">ORF found outside the</text>
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; fill: #5b5b5b" transform="translate(214.865063 315.157988)">ingroup → removed</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="464.4" y="209.621689" transform="rotate(-0 464.4 209.621689)">7d–7g  Corroborate</text>
   </g>
   <g id="text_18">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(387.345313 229.663027)">both enabler nodes seen</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(400.587344 244.382988)">in an extant species,</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(392.021094 260.330137)">and they are the parent</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(393.573125 276.444629)">and grandparent of the</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(393.21 292.960527)">ORF node; else PDNG</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="652.464" y="209.621836" transform="rotate(-0 652.464 209.621836)">8–9  Summarize</text>
   </g>
   <g id="text_20">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(591.366031 228.271777)">counts by node and</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(582.037438 244.382988)">species; loci placed on</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(599.154625 260.330137)">internal nodes by</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(616.277281 277.750566)">coordinates</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="840.528" y="209.621836" transform="rotate(-0 840.528 209.621836)">Output</text>
   </g>
   <g id="text_22">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(759.220813 228.35709)">DNG and PDNG catalogs;</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(788.787063 245.692207)">node summaries</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(804.733938 260.412168)">per species</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(808.623313 276.291504)">→ stage 5</text>
   </g>
  </g>
 </g>
