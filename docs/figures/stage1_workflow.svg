   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="150.96" y="24.941836" transform="rotate(-0 150.96 24.941836)">Input</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(75.866406 43.673809)">standardized proteomes</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(73.925 59.70627)">(stage 0); rooted species</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(107.774375 75.735449)">tree (optional)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="464.4" y="24.941836" transform="rotate(-0 464.4 24.941836)">OrthoFinder</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(386.98875 43.681465)">DIAMOND all against all;</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(389.309687 59.620957)">hierarchical orthogroups</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(378.41375 75.739824)">(HOGs) and a node-labeled</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(426.66125 91.761348)">species tree</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="777.84" y="24.941836" transform="rotate(-0 777.84 24.941836)">Node placement</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(703.119375 43.591777)">each gene placed at the</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(701.206406 61.098613)">node where its HOG first</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(691.454531 75.650137)">appears; unclustered genes</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(716.374531 91.84666)">are species-specific</text>
   </g>
   <g id="text_7">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; text-anchor: middle; fill: #5b5b5b" x="777.84" y="114.232383" transform="rotate(-0 777.84 114.232383)">HOG table of the clade root</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="150.96" y="191.981836" transform="rotate(-0 150.96 191.981836)">Cross-check</text>
   </g>
   <g id="text_9">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(66.141875 212.023027)">removes candidates whose</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(81.317656 226.660957)">orthogroup or pairwise</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(90.254688 242.690137)">orthologues include</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(101.543281 258.801348)">another species</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #14694c" x="464.4" y="191.981836" transform="rotate(-0 464.4 191.981836)">Verification</text>
   </g>
   <g id="text_11">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(381.920313 210.631777)">re-derives every candidate</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(383.095 226.832676)">from the HOG table; stops</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(399.029844 242.690137)">on any disagreement</text>
   </g>
   <g id="text_12">
    <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; text-anchor: middle; fill: #5b5b5b" x="464.4" y="263.632383" transform="rotate(-0 464.4 263.632383)">check, removes no gene</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: middle; fill: #1a1a1a" x="777.84" y="191.981836" transform="rotate(-0 777.84 191.981836)">Output</text>
   </g>
   <g id="text_14">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(697.294063 210.71709)">candidate lineage-specific</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(705.865781 226.74627)">genes (cLSGs), protein</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(718.834375 242.85748)">FASTA per species</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(745.935313 258.740098)">→ stage 2</text>
   </g>
  </g>
 </g>
